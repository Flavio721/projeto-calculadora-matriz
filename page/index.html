<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../script/script.js" defer></script>
    <style>
        
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        
        html, body{
            min-height: 100vh;
            width: 100%;
            background-color: rgb(190, 234, 252);
        }
        
        header{
            padding: 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        
            h1{
                font-weight: bold;
            }
            p{
                font-size: 1.2em;
            }
        }
        
        main{
            width: 80%;
            padding: 20px;
            padding-bottom: 40px;
            margin: auto;
            border-radius: 10px;
            background-color: rgb(250, 250, 250);
        }
        form{
            width: 100%;
            padding: 10px;
        }
        
        #input-guiado {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 24px;
            border-radius: 10px;
            background-color: rgb(230, 245, 255);
            width: fit-content;
        }
        
        #posicao-label {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
        }
        
        #valor-celula {
            width: 120px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid rgb(190, 234, 252);
            background-color: transparent;
            text-align: center;
            font-size: 1.1em;
            outline: none;
        }
        
        #valor-celula:focus {
            border-color: #0d6efd;
        }
        
        #btn-proximo {
            padding: 8px 28px;
            border-radius: 8px;
            border: none;
            background-color: #0d6efd;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        #btn-proximo:hover {
            background-color: #0b5ed7;
        }
        .div-matrizes {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            width: 100%;
            flex-wrap: wrap;
        }
        .matriz {
            display: grid;
            gap: 4px;
            margin: 20px auto;
            width: fit-content;
        }
        
        #simbolo-operacao, #simbolo-igual {
            font-size: 2em;
            font-weight: bold;
            color: #0d6efd;
        }
        .celula-matriz {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0d6efd;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            color: #333;
            background-color: white;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        #modal-confirmacao {
            background-color: white;
            border-radius: 12px;
            padding: 32px;
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        
        #modal-titulo {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
        }
        
        #modal-mensagem {
            font-size: 1em;
            color: #555;
            text-align: center;
        }
        
        #modal-botoes {
            display: flex;
            gap: 12px;
        }
        
        #btn-confirmar {
            padding: 8px 24px;
            border-radius: 8px;
            border: none;
            background-color: #0d6efd;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        #btn-confirmar:hover {
            background-color: #0b5ed7;
        }
        
        #btn-cancelar {
            padding: 8px 24px;
            border-radius: 8px;
            border: 2px solid #dc3545;
            background-color: transparent;
            color: #dc3545;
            font-size: 1em;
            cursor: pointer;
            transition: 0.2s;
        }
        
        #btn-cancelar:hover {
            background-color: #dc3545;
            color: white;
        }
        .resultado-escalar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 24px;
            border-radius: 10px;
            background-color: rgb(230, 245, 255);
            width: fit-content;
            margin: 20px auto;
        }
        
        .escalar-label {
            font-size: 1em;
            color: #555;
            font-weight: 600;
        }
        
        .escalar-valor {
            font-size: 2em;
            font-weight: bold;
            color: #0d6efd;
        }
        #passo-a-passo {
            width: 80%;
            margin: 24px auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .passo {
            background-color: rgb(230, 245, 255);
            border-radius: 10px;
            padding: 16px 24px;
        }
        
        .passo-titulo {
            font-weight: bold;
            font-size: 1.1em;
            color: #0d6efd;
            margin-bottom: 8px;
        }
        
        .passo-descricao {
            color: #333;
            line-height: 1.6;
        }
        #div-exportar {
            display: flex;
            justify-content: center;
            margin: 16px 0 8px 0;
        }
        
        #btn-exportar {
            padding: 10px 32px;
            border-radius: 8px;
            border: none;
            background-color: #0d6efd;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        #btn-exportar:hover {
            background-color: #0b5ed7;
        }
    </style>
    <title>Calculadora de matrizes</title>
</head>
<body>
    <header>
        <h1>Matriz Calculator</h1>
        <p>Visualize e calcule operações de matrizes passo a passo</p>
    </header>
    <main id="main-content">
        <div class="form-div no-print">
            <form id="matrizForm" class="row gx-3 gy-2 align-items-center">
                <div class="col-sm-3">
                    <label class="visually" for="ilinhas">Número de linhas</label>
                    <input type="number" class="form-control bg-transparent border border-2 border-gray" id="ilinhas" placeholder="Linhas" min="1" max="10" step="1">
                </div>

                <div class="col-sm-3">
                    <label class="visually" for="icolunas">Número de colunas</label>
                    <input type="number" class="form-control  bg-transparent border border-2 border-gray" id="icolunas" placeholder="Colunas" min="1" max="10" step="1">
                </div>

                <div class="col-sm-3">
                    <label class="visually" for="operacao">Operações</label>
                    <select class="form-select  bg-transparent border border-2 border-gray" id="operacao">
                        <optgroup label="Uma matriz">
                            <option value="transposta">Matriz Transposta</option>
                            <option value="inversa">Matriz Inversa</option>
                            <option value="determinante">Determinante</option>
                            <option value="escalar">Multiplicação por Escalar</option>
                        </optgroup>
                        <optgroup label="Duas matrizes">
                            <option value="soma">Soma de Matrizes</option>
                            <option value="subtracao">Subtração de Matrizes</option>
                            <option value="multiplicacao">Multiplicação de Matrizes</option>
                        </optgroup>
                    </select>
                </div>

                <div class="col-auto">
                    <button type="submit" class="btn btn-primary" style="margin-top: 20px;">Gerar Matriz</button>
                </div>
            </form>
        </div>
        <div class="div-matrizes">
            <div class="matriz" id="matriz1"></div>

            <p id="simbolo-operacao" style="display:none;">+</p>

            <div id="input-guiado" style="display:none;">
                <p id="posicao-label">Digite o valor de A[1][1]</p>
                <input type="number" id="valor-celula" placeholder="0">
                <button id="btn-proximo">Próximo</button>
            </div>

            <div class="matriz" id="matriz2" style="display:none;"></div>

            <p id="simbolo-igual" style="display:none;">=</p>

            <div class="matriz" id="matriz-resultado" style="display:none;">
            </div>
        </div>
        <div id="passo-a-passo" style="display:none;"></div>
        <div id="div-exportar" style="display:none;" class="no-print">
            <button id="btn-exportar">Exportar Imagem</button>
        </div>
    </main>
    <div id="overlay" style="display:none;">
        <div id="modal-confirmacao">
            <h2 id="modal-titulo">⚠️ Matriz grande!</h2>
            <p id="modal-mensagem">Você deseja criar uma matriz com mais de 5 linhas ou colunas? Isso pode poluir a tela.</p>
            <div id="modal-botoes">
                <button id="btn-confirmar">Sim, continuar</button>
                <button id="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
